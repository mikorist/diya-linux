UI gfxboot gfx-cpio readme.msg
timeout 40
default systemd
MENU TITLE diya Linux

LABEL goback
    MENU LABEL  Return to main menu
    CONFIG /boot/syslinux/syslinux.cfg
    
LABEL checkmedia
    MENU LABEL  Proveri ispravnost sistema (sysvinit)
    KERNEL /antiX/vmlinuz
    APPEND nosplash checkmd5 init=/lib/sysvinit/init
    INITRD /antiX/initrd.gz
    
LABEL checkmedia2
    MENU LABEL  Pokreni diya Linux
    KERNEL /antiX/vmlinuz
    APPEND nosplash checkmd5 init=/lib/systemd/systemd
    INITRD /antiX/initrd.gz
