#--------------------------------------------------------------------
# This is the isolinux.cfg and/or syslinux.cfg file
# It controls the main menu in the bootloader on the live system.
# You can edit it to change the main bootloader menu on a LiveUSB.
# If you are not careful you can break the live system and prevent
# it from booting.
#--------------------------------------------------------------------

UI gfxboot gfx-cpio readme.msg
timeout 40
default systemd

MENU TITLE diya Linux

LABEL systemd
    MENU LABEL  Pokreni diya Linux
    KERNEL /antiX/vmlinuz
    APPEND nosplash init=/lib/systemd/systemd
    INITRD /antiX/initrd.gz

LABEL checkmedia
	MENU LABEL  Proveri ispravnost medija
	CONFIG /boot/syslinux/checkmedia.cfg

LABEL harddisk
    MENU LABEL Pokreni sa hard diska
    COM32 chain.c32
    APPEND hd0

LABEL memtest
    MENU LABEL Test memorije
    KERNEL /boot/memtest

LABEL grub
    MENU LABEL Pokreni GRUB
    KERNEL /boot/grub/i386-pc/lnxboot.img
    INITRD /boot/grub/i386-pc/core.img    
